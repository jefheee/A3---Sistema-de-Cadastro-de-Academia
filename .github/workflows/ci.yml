name: CI - Testes e Cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Compilação, Análise Estática e Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Análise Estática - ESLint
        run: npm run lint

      - name: Análise Estática - Verificação de tipos TypeScript
        run: npx tsc --noEmit

      - name: Executar testes com cobertura (Quality Gate)
        run: npm run test:coverage
